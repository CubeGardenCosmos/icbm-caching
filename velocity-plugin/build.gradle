plugins {
    id 'java-library'
    id 'application'
}

version = project.plugin_version
group = project.maven_group

repositories {
    mavenCentral()
}

dependencies {
    // 共享协议模块（includeBuild('../protocol') 提供）
    api "cn.cubegarden.icbm.caching:protocol:${project.protocol_version}"
    implementation 'org.slf4j:slf4j-api:2.0.16' // Velocity 运行时提供（独立进程形态自备）

    // 独立进程形态（ControlServiceMain）的日志实现；Velocity 插件形态由代理进程提供
    runtimeOnly 'ch.qos.logback:logback-classic:1.5.12'

    testImplementation platform('org.junit:junit-bom:5.11.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'ch.qos.logback:logback-classic:1.5.12'
}

application {
    // master 独立进程形态（阶段2 并入后；Velocity 插件入口于阶段5 接线）
    mainClass = 'cn.cubegarden.icbm.caching.control.ControlServiceMain'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
    }
}
